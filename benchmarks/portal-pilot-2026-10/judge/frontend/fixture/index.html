<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluator proof fixture</title><style>body{font:16px sans-serif;margin:16px}main{max-width:100%}input,textarea{box-sizing:border-box;max-width:100%}button,a{margin:4px} :focus-visible{outline:3px solid blue}li{margin:8px}footer{margin:16px}</style><body><nav aria-label="Fixture navigation">Evaluator fixture</nav><main id="app"></main><footer>Fictional local demo by AethDesign</footer><script>
const mode='__MODE__',app=document.querySelector('#app');let user,projects=[],data,active=localStorage.getItem('active'),section='brief';const el=(id)=>document.querySelector(`[data-testid="${id}"]`);const button=(id,t)=>`<button data-testid="${id}">${t}</button>`;const field=(id,t,area=false)=>`<label>${t}${area?`<textarea data-testid="${id}"></textarea>`:`<input data-testid="${id}">`}</label>`;const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
async function api(url,body){let r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let b=await r.json();if(!r.ok)throw Error(b.error?.message||'Request failed');return b;}
function loginView(){app.innerHTML=`<form data-testid="login-form">${field('login-email','Email')}${field('login-password','Password')}${button('login-submit','Sign in')}<p data-testid="login-error" hidden></p></form>`;el('login-password').type='password';el('login-form').onsubmit=async e=>{e.preventDefault();try{user=(await api('/api/login',{email:el('login-email').value,password:el('login-password').value})).user;await overview();}catch(e){el('login-error').hidden=false;el('login-error').textContent=e.message;}};}
function header(){return `<p data-testid="user-name">${user.name}</p>${button('logout','Sign out')}`;}
function logoutSetup(){el('logout').onclick=async()=>{await api('/api/logout',{});active=null;localStorage.removeItem('active');loginView();};}
async function overview(){projects=(await api('/api/projects')).projects;active=null;localStorage.removeItem('active');app.innerHTML=header()+`<section data-testid="project-list">${projects.map(p=>`<article data-testid="project-card" data-project-id="${p.id}"><h2>${p.title}</h2><button data-testid="open-project" data-project-id="${p.id}">Open project</button></article>`).join('')}</section>`;logoutSetup();document.querySelectorAll('[data-testid="open-project"]').forEach(e=>e.onclick=()=>detail(e.dataset.projectId));if(mode==='leak'&&user.id==='c2')app.insertAdjacentHTML('beforeend','<p>Harbor House Identity</p>');}
async function detail(pid){active=pid;localStorage.setItem('active',pid);data=await api('/api/projects/'+pid);render();}
function money(p){let amount=p.budgetCents/100;if(mode==='money_scale')return 'EUR '+p.budgetCents;if(mode==='money_us')return '€'+amount.toLocaleString('en-US',{minimumFractionDigits:2});if(mode==='money_de')return amount.toLocaleString('de-DE',{minimumFractionDigits:2})+' €';if(mode==='money_space')return amount.toLocaleString('fr-FR',{minimumFractionDigits:2})+' EUR';if(mode==='money_plain')return 'EUR '+amount;return 'EUR '+amount.toFixed(2);}
function render(){let p=data.project;app.innerHTML=header()+button('back-projects','Overview')+`<section data-testid="project-detail" data-project-id="${p.id}"><h1 data-testid="project-title">${p.title}</h1><p data-testid="project-status">${p.status.replaceAll('_',' ')}</p><p data-testid="project-budget" data-total-cents="${mode==='budget'?99:p.budgetCents}">${money(p)}</p><nav aria-label="Project sections">${['brief','revisions','discussion','activity'].map(t=>button('tab-'+t,t)).join('')}</nav><div id="section"></div></section>`;logoutSetup();el('back-projects').onclick=overview;for(let t of ['brief','revisions','discussion','activity'])el('tab-'+t).onclick=()=>{section=t;renderSection();};renderSection();if(mode==='overflow')app.style.minWidth='1700px';if(mode==='runtime')setTimeout(()=>{throw Error('Seeded runtime failure')},20);if(mode==='http')fetch('/api/broken');}
function renderSection(){let p=data.project,s=document.querySelector('#section');if(section==='brief')s.innerHTML=`<p data-testid="project-brief">Create a clear and memorable identity system for a thoughtful hospitality team serving their community.</p><ul data-testid="project-deliverables"><li>Wordmark design</li><li>Color system</li><li>Typography guidelines</li></ul><ol data-testid="project-timeline"><li>Discovery complete</li><li>Identity review</li><li>Brand handoff</li></ol>`;
if(section==='revisions'){s.innerHTML=`<p data-testid="current-revision">${p.currentRevision}</p>${Array.from({length:p.currentRevision},(_,i)=>`<article data-testid="revision-card" data-revision-number="${i+1}">Revision ${i+1}: Identity direction. ${data.history.join(' ')}</article>`).join('')}<p data-testid="decision-status"></p><p data-testid="revision-status"></p>`;if(user.role==='client'&&p.status==='awaiting_review'){s.insertAdjacentHTML('beforeend',field('decision-note','Review note',true)+button('approve-revision','Approve')+button('request-changes','Request changes'));el('request-changes').onclick=async()=>{let note=el('decision-note').value;if(!note.trim()&&mode!=='validation'){el('decision-status').textContent='Describe requested changes';return;}if(mode==='validation'&&!note.trim()){p.status='changes_requested';render();return;}await api('/api/projects/'+p.id+'/decision',{revision:p.currentRevision,decision:'request_changes',note});await detail(p.id);el('decision-status').textContent='Changes requested saved';};el('approve-revision').onclick=()=>{};}
if(user.role==='staff'||mode==='staff_controls'){s.insertAdjacentHTML('beforeend',field('revision-title','Revision title')+field('revision-summary','Revision summary',true)+button('publish-revision','Publish revision'));el('publish-revision').onclick=async()=>{await api('/api/projects/'+p.id+'/revisions',{expectedRevision:p.currentRevision,title:el('revision-title').value,summary:el('revision-summary').value});await detail(p.id);if(mode==='publish'){data.project.currentRevision=1;render();}el('revision-status').textContent='Revision published';};}}
if(section==='discussion'){s.innerHTML=field('comment-body','Comment body',true)+button('comment-submit','Post comment')+`<p data-testid="comment-status"></p><div>${data.comments.map(c=>`<article data-testid="comment-item"><span>${c.author.name}</span><p data-testid="comment-text">${mode==='literal'?c.body:escape(c.body)}</p></article>`).join('')}</div>`;el('comment-submit').onclick=async()=>{await api('/api/projects/'+p.id+'/comments',{body:el('comment-body').value});await detail(p.id);el('comment-status').textContent='Comment saved';};}
if(section==='activity')s.innerHTML=data.events.map(e=>`<p data-testid="activity-item" data-event-type="${e.type}">${e.type}</p>`).join('');if(mode==='labels')document.querySelectorAll('label').forEach(l=>{let c=l.querySelector('input,textarea');l.replaceWith(c);});}
(async()=>{try{user=(await api('/api/me')).user;projects=(await api('/api/projects')).projects;if(active&&projects.some(p=>p.id===active))await detail(active);else await overview();}catch{loginView();}})();
</script></body></html>
