version = 1
standard_version = 3
project = "ServiceFlow"

[policy]
map_word_limit = 900

[audit]
default_base = "HEAD"
independent_audit_min_risk = "high"
required_profiles_by_risk = { low = ["fast"], normal = ["changed"], high = ["full"], critical = ["full", "release"] }

# Commands are argument arrays, never shell strings. The bootstrapper detects
# conservative local commands; tailor them as the project gains tooling.
# Multiple arrays run sequentially in the project root. They must be local and
# non-destructive; deployment and other external writes are never verify commands.
[verify]
fast = [["npm", "run", "typecheck"], ["git", "diff", "--check"]]
changed = [["npm", "test"], ["npm", "run", "typecheck"], ["git", "diff", "--check"]]
full = [["npm", "test"], ["npm", "run", "typecheck"], ["npm", "run", "format:check"], ["git", "diff", "--check"]]
release = [["npm", "run", "build"], ["npm", "run", "test:setup"], ["git", "diff", "--check"]]

# Keep a default route so every changed file receives a risk classification.
[[areas]]
name = "default"
paths = ["**"]
risk = "normal"
fallback = true
map_sections = ["Product boundary", "Verification"]
tests = []
required_profiles = []

# Add narrower routes after the default. The highest matched risk wins.
[[areas]]
name = "server-and-migrations"
paths = ["src/server/**", "migrations/**"]
risk = "critical"
map_sections = ["Contracts and state", "Security, privacy, and safety", "Change invariants"]
tests = ["tests/backend.test.ts"]
required_profiles = ["full", "release"]

[[areas]]
name = "auth-and-state"
paths = ["**"]
risk = "critical"
map_sections = ["Contracts and state", "Security, privacy, and safety", "Change invariants"]
tests = ["tests/backend.test.ts", "scripts/browser_checks.py", "scripts/fresh_setup.py"]
required_profiles = ["full", "release"]
