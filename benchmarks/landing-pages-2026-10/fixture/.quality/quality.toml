version = 1
standard_version = 3
project = "fixture"

[policy]
map_word_limit = 900

[audit]
default_base = "HEAD"
independent_audit_min_risk = "high"
required_profiles_by_risk = { low = ["fast"], normal = ["changed"], high = ["full"], critical = ["full", "release"] }

# Commands are argument arrays, never shell strings. The bootstrapper detects
# conservative local commands; tailor them as the project gains tooling.
# Multiple arrays run sequentially in the project root. They must be local and
# non-destructive; deployment and other external writes are never verify commands.
[verify]
fast = [["python3", "-c", "from pathlib import Path; assert all((Path(x)/'index.html').is_file() for x in ('shop','craftsman','restaurant'))"]]
changed = [["python3", "-c", "from pathlib import Path; assert all((Path(x)/'index.html').is_file() for x in ('shop','craftsman','restaurant'))"]]
full = [["python3", "-c", "from pathlib import Path; assert all((Path(x)/'index.html').is_file() for x in ('shop','craftsman','restaurant'))"]]
release = [["python3", "-c", "from pathlib import Path; assert all((Path(x)/'index.html').is_file() for x in ('shop','craftsman','restaurant'))"]]

[[areas]]
name = "fictional-static-ui"
paths = ["**"]
risk = "normal"
fallback = true
map_sections = ["Product boundary", "Verification"]
tests = []
required_profiles = []
